name: Temporary Direct xDrip4iOS Build
run-name: Direct xDrip4iOS Build (${{ github.ref_name }})

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout Repo for building
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Run Sibionics 2 JVM tests
        run: gradle -p Sibionics2Core jvmTest

      - name: Build Sibionics 2 XCFramework
        run: gradle -p Sibionics2Core assembleSibionics2CoreReleaseXCFramework

      - name: Verify Sibionics 2 XCFramework
        run: |
          framework_path="Sibionics2Core/build/XCFrameworks/release/Sibionics2Core.xcframework"
          if [ ! -d "$framework_path" ]; then
            echo "::error::Expected XCFramework was not created at $framework_path"
            exit 1
          fi

      - name: Run xDrip tests
        run: xcodebuild test -project xdrip.xcodeproj -scheme xdrip -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            artifacts
            buildlog
